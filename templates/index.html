<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Price Comparison</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container-box {
            background: #121212;
            border-radius: 15px;
            padding: 20px;
            width: 350px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .product-image {
            width: 100px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .status-box {
            background: #222;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .status-text {
            font-size: 16px;
        }
    </style>
</head>
<body class="mt-5">

    <h1 class="mb-4">📸 Upload an Image for Price Comparison</h1>
    
    <div class="container-box">
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <label for="file" class="d-block mb-2">🖼 Select an Image</label>
            <input type="file" name="file" id="file" class="form-control mb-3" required accept="image/*">
            <button type="submit" class="btn btn-primary w-100">🚀 Upload & Compare</button>
        </form>

        <!-- Image Preview -->
        <div id="imagePreview" class="mt-3" style="display: none;">
            <img id="previewImg" src="" class="product-image">
            <h5 id="productName">🛍 Product: Loading...</h5>
        </div>

        <!-- Scraping Status -->
        <div id="scrapingStatus" class="status-box" style="display: none;">
            <p class="status-text">⏳ Scraping data...</p>
        </div>
    </div>

    <script>
        document.getElementById('file').addEventListener('change', function(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                    document.getElementById('productName').innerText = "🛍 Product: " + file.name.split('.')[0];
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', function() {
            document.getElementById('scrapingStatus').style.display = 'block';
            document.querySelector('.status-text').innerText = "⏳ Scraping data...";
        });
    </script>

</body>
</html>
