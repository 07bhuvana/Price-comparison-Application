<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Price Comparison Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .result-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
        }
        .btn-primary {
            background-color: #ff5f6d;
            border: none;
        }
        .btn-primary:hover {
            background-color: #ff3c4e;
        }
        table {
            color: white;
        }
        a {
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h2>📊 Price Comparison Results</h2>
        <h4>🛒 Item: <strong>{{ item }}</strong></h4>
        <img src="{{ url_for('static', filename='uploads/' + filename) }}" class="img-thumbnail my-3" width="150">
        
        <table class="table table-dark table-bordered">
            <thead>
                <tr>
                    <th>🛍 Platform</th>
                    <th>💲 Price (₹)</th>
                    <th>🔗 Link</th>
                </tr>
            </thead>
            <tbody>
                {% for platform, (price, link) in prices.items() %}
                <tr>
                    <td>{{ platform }}</td>
                    <td>₹{{ price }}</td>
                    <td><a href="{{ link }}" target="_blank">🔎 View</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <h4 class="text-success">🏆 Best Price: ₹{{ best_platform[1][0] }} on <strong>{{ best_platform[0] }}</strong></h4>
        <a href="/" class="btn btn-primary mt-3">🔄 Try Another</a>
    </div>
</body>
</html>
